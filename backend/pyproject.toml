[tool.poetry]
name = "lawyer-brain"
version = "0.1.0"
description = "A RAG Brain of Good and Bad Lawyers, modified from Weaviate's Verba"
authors = ["Michael Doyle <michaeldoyle1994@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/doyled-it/lawyer-brain"
packages = [
    { include = "lb" },
]

[tool.poetry.scripts]
lb = "lb.cli:cli"

[tool.poetry.dependencies]
python = "^3.12"
beautifulsoup4 = "^4.12.3"
requests = "2.31.0"
rich = "^13.7.1"
typer = {extras = ["all"], version = "^0.12.3"}
weaviate-client = "3.23.1"
python-dotenv = "1.0.0"
wasabi = "1.1.2"
fastapi = {extras = ["standard"], version = "^0.112.0"}
uvicorn = {version = "0.29.0", extras = ["standard"]}
asyncio = "3.4.3"
pypdf = "4.2.0"
python-docx = "1.1.2"
chromadb = "^0.5.5"
transformers = "^4.43.3"
langchain = "^0.2.12"
langchain-chroma = "^0.1.2"
langchain-openai = "^0.1.20"
langchain-community = "^0.2.11"
langchain-huggingface = "^0.0.3"

# A list of all of the optional dependencies, some of which are included in the
# below `extras`. They can be opted into by apps.
sentence-transformers = { version = "3.0.1", optional = true }
vertexai = { version = "1.46.0", optional = true }
pygobject = "^3.48.2"
mutahunter = "^1.2.1"
pydantic = "^2.8.2"
langchain-anthropic = "^0.1.22"
langchain-google-genai = "^1.0.8"
langchain-mistralai = "^0.1.12"
pydantic-settings = "^2.4.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
isort = "^5.13.2"
flake8 = "^7.1.0"
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
requests-mock = "^1.12.1"

[tool.poetry.extras]
huggingface = ["sentence-transformers"]
google = ["vertexai"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 90
target-version = ['py312']

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

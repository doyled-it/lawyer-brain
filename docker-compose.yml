version: "3.9"

networks:
  net:
    driver: bridge

services:
  db:
    image: lbdb
    build:
      context: .
      dockerfile: lbdb.Dockerfile
    volumes:
      # Be aware that indexed data are located in "/chroma/chroma/"
      # Default configuration for persist_directory in chromadb/config.py
      # Read more about deployments: https://docs.trychroma.com/deployment
      - chroma-data:/chroma/chroma
    command: "--workers 1 --host 0.0.0.0 --port 9000 --proxy-headers --log-config chromadb/log_config.yml --timeout-keep-alive 30"
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_AUTHN_PROVIDER=${CHROMA_SERVER_AUTHN_PROVIDER}
      - CHROMA_SERVER_AUTHN_CREDENTIALS_FILE=${CHROMA_SERVER_AUTHN_CREDENTIALS_FILE}
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_SERVER_AUTHN_CREDENTIALS}
      - CHROMA_AUTH_TOKEN_TRANSPORT_HEADER=${CHROMA_AUTH_TOKEN_TRANSPORT_HEADER}
      - PERSIST_DIRECTORY=${PERSIST_DIRECTORY:-/chroma/chroma}
      - CHROMA_OTEL_EXPORTER_ENDPOINT=${CHROMA_OTEL_EXPORTER_ENDPOINT}
      - CHROMA_OTEL_EXPORTER_HEADERS=${CHROMA_OTEL_EXPORTER_HEADERS}
      - CHROMA_OTEL_SERVICE_NAME=${CHROMA_OTEL_SERVICE_NAME}
      - CHROMA_OTEL_GRANULARITY=${CHROMA_OTEL_GRANULARITY}
      - CHROMA_SERVER_NOFILE=${CHROMA_SERVER_NOFILE}
    restart: unless-stopped # possible values are: "no", always", "on-failure", "unless-stopped"
    ports:
      - "9000:9000"
    healthcheck:
      # Adjust below to match your container port
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - net

  backend:
    image: lb-backend
    build:
      context: backend
      dockerfile: backend.Dockerfile
    environment:
      - PORT=8000
      - LB_ENVIRONMENT=docker
      - LB_CHROMA_PATH=db
      - LB_CHROMA_DOCKER=True
      - LB_CHROMA_PORT=9000
      - LB_CHROMA_K=20
      - LB_CHROMA_CONTEXT=5
      - LB_CHROMA_EMBEDDING_FUNCTION=OpenAI
      - LB_LLM_MODEL=gpt-4o-mini
      - LB_LLM_MODEL_FAMILY=OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    # command: >
    #   /bin/sh -c "trap : TERM INT; sleep infinity & wait"
    ports:
      - "8000:8000"
    networks:
      - net

  frontend:
    image: lb-frontend
    build:
      context: frontend
      dockerfile: frontend.Dockerfile
    environment:
      - REACT_APP_BACKEND_URL="http://backend/chat"
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - net

volumes:
  chroma-data:
    driver: local
